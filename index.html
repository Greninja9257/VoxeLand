<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxeLand</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #gui { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-family: monospace; background: #2b2b2b; z-index: 10; }
    #loading .bar { width: 320px; height: 8px; background: #111; border: 2px solid #555; margin-top: 12px; }
    #loading .fill { height: 100%; background: #6c6; width: 0%; }
    #loading .err { color: #f66; max-width: 640px; white-space: pre-wrap; }
    canvas { outline: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="gui"></canvas>
  <div id="loading"><div id="loading-text">Loading VoxeLand…</div><div class="bar"><div class="fill" id="loading-fill"></div></div><div class="err" id="loading-err"></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
