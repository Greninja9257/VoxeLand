<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxeLand</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #gui { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    /* vanilla LoadingOverlay: Mojang red, the studio wordmark centred (4 x d0 wide, d0 = min(0.75w, h) / 4),
       a white outlined progress bar 300x10 GUI pixels at 83.25% height, one-second fade once the game is ready */
    #loading { --gui: 2; position: fixed; inset: 0; display: block; background: #ef323d; z-index: 10; transition: opacity 1s linear; }
    #loading.fade { opacity: 0; pointer-events: none; }
    #loading .logo { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(75vw, 100vh); height: auto; image-rendering: pixelated; image-rendering: crisp-edges; user-select: none; -webkit-user-drag: none; }
    #loading .bar { position: absolute; left: 50%; top: 83.25%; width: calc(302px * var(--gui)); height: calc(12px * var(--gui)); transform: translate(-50%, -50%); border: calc(1px * var(--gui)) solid #fff; box-sizing: border-box; }
    #loading .fill { position: absolute; left: calc(1px * var(--gui)); top: calc(1px * var(--gui)); bottom: calc(2px * var(--gui)); width: 0%; max-width: calc(100% - 2px * var(--gui)); background: #fff; }
    #loading .err { position: absolute; left: 50%; top: 90%; transform: translateX(-50%); color: #fff; font-family: monospace; font-size: 12px; max-width: 640px; white-space: pre-wrap; text-align: center; }
    canvas { outline: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="gui"></canvas>
  <div id="loading"><img class="logo" src="./loading-logo.png" alt="VoxeLand" draggable="false" /><div class="bar"><div class="fill" id="loading-fill"></div></div><div class="err" id="loading-err"></div><span id="loading-text" hidden></span></div>
  <script>
    // vanilla "GUI Scale: Auto": the largest integer scale that still fits 320x240 GUI pixels on screen
    (function () {
      var el = document.getElementById('loading');
      function fit() { var s = 1; while (innerWidth / (s + 1) >= 320 && innerHeight / (s + 1) >= 240) s++; el.style.setProperty('--gui', String(s)); }
      fit(); addEventListener('resize', fit);
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
